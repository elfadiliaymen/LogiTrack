groups:
  - name: logitrack-alerts
    rules:
      - alert: LogiTrackApiDown
        expr: up{job="logitrack-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "LogiTrack API is down"
          description: "Prometheus cannot reach LogiTrack API for more than 1 minute."

      - alert: LogiTrackHighErrorRate
        expr: sum(rate(http_server_requests_seconds_count{job="logitrack-api",status=~"5.."}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High 5xx error rate"
          description: "LogiTrack 5xx error rate exceeds 0.5/s over 5 minutes."

      - alert: LogiTrackHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{job="logitrack-api"}[5m])) by (le)) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High response time (p95)"
          description: "LogiTrack p95 response time exceeds 2 seconds for 5 minutes."

      - alert: LogiTrackHighHeapUsage
        expr: sum(jvm_memory_used_bytes{job="logitrack-api",area="heap"}) / sum(jvm_memory_max_bytes{job="logitrack-api",area="heap"}) > 0.85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High JVM heap usage"
          description: "LogiTrack JVM heap usage exceeds 85% for 5 minutes."
