# Configuration Prometheus - Carte 2
global:
  scrape_interval: 10s
  evaluation_interval: 15s

scrape_configs:
  # L'API Spring Boot expose ses metriques via Actuator
  - job_name: "logitrack-api"
    metrics_path: "/actuator/prometheus"
    scrape_interval: 10s
    static_configs:
      - targets: ["api:8087"]